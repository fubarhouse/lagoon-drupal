docker-compose-yaml: docker-compose.yml

project: drupal-base

tasks:
  post-rollout:
    - run:
        name: drush updb
        # This will only run if the database exists.
        command: |
          if [[ $(drush status --field=Database) == "Connected" ]]; then drush -y updb; fi
        service: cli
        shell: bash
    - run:
        name: drush cr
        # This will only run if the database exists.
        command: |
          if [[ $(drush status --field=Database) == "Connected" ]]; then drush -y cr; fi
        service: cli
        shell: bash

environments:
  main:
    routes:
      - nginx:
        - dafkv9e6232h8.cloudfront.net:
            tls-acme: false
            insecure: Allow
        - example.lagoon.fubarhouse.io:
            tls-acme: true
            insecure: Allow

